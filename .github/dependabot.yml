# Dependabot config — auto-update pinned GitHub Action SHAs (see P2-1).
# Actions in .github/workflows/*.yml are pinned to specific commits; this file
# tells Dependabot to open a PR each month when there are newer patch/minor
# releases so we don't lag too far behind.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  # P3-6: weekly npm dependency updates. Lower cadence than dev cycle (weekly,
  # not daily) so the PR queue stays manageable. Groups patch + minor together
  # to avoid 10 separate PRs every Monday.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
